<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout}"
      th:with="pageTitle='Cards',activeNav='cards'"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<th:block th:fragment="content">

    <div class="nb-page-header nb-fade-in">
        <div>
            <h1 class="nb-page-title"><i class="bi bi-wallet2 me-2"></i>Cards</h1>
            <p class="nb-page-subtitle">Manage your debit and credit cards</p>
        </div>
    </div>

    <div class="nb-empty-state nb-card nb-fade-in nb-delay-1" style="padding: 60px 20px;">
        <i class="bi bi-credit-card-2-front" style="font-size:3rem; opacity:0.3;"></i>
        <h3 style="margin-top:16px; font-size:1.1rem;">Card Management Coming Soon</h3>
        <p class="nb-text-muted" style="max-width:400px; text-align:center; margin-top:8px;">
            Debit and credit card management, freeze/unfreeze, spending limits, and virtual cards will be available here.
            Contact your NexusBank branch for immediate card assistance.
        </p>
        <a th:href="@{/dashboard}" class="nb-btn nb-btn-primary mt-4">
            <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
        </a>
    </div>

</th:block>
</html>
