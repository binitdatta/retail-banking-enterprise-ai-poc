<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Error | NexusBank</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'DM Sans', system-ui, sans-serif;
            background: #080c14; color: #e8edf8;
        }
        .err-wrap { text-align: center; padding: 40px 24px; max-width: 520px; }
        .err-code { font-size: 7rem; font-weight: 900; line-height: 1; opacity: 0.25; font-variant-numeric: tabular-nums; }
        .err-title { font-size: 1.5rem; font-weight: 700; margin-top: 16px; }
        .err-msg { color: #8896b3; margin-top: 10px; line-height: 1.7; font-size: 0.9rem; }
        .err-detail { font-family: monospace; font-size: 0.75rem; color: #ef4444;
                      background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2);
                      padding: 10px 16px; border-radius: 8px; margin-top: 16px;
                      text-align: left; word-break: break-word; }
        .err-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 28px;
                   padding: 10px 22px; background: #3d6fd4; color: #fff; text-decoration: none;
                   border-radius: 8px; font-size: 0.9rem; font-weight: 500; transition: opacity 0.2s; }
        .err-btn:hover { opacity: 0.85; }
    </style>
</head>
<body>
<div class="err-wrap">
    <div class="err-code" th:text="${status ?: '500'}">500</div>
    <h1 class="err-title" th:text="${error ?: 'Internal Server Error'}">Internal Server Error</h1>
    <p class="err-msg" th:text="${message ?: 'An unexpected error occurred. Please try again or contact NexusBank support.'}">
        An unexpected error occurred.
    </p>
    <div class="err-detail" th:if="${trace != null and #strings.length(trace) > 0}"
         th:text="${#strings.substring(trace, 0, 300)}"></div>
    <a th:href="@{/dashboard}" class="err-btn">
        <i class="bi bi-house"></i> Return to Dashboard
    </a>
</div>
</body>
</html>
