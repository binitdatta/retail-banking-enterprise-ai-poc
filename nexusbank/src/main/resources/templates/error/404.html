<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Not Found | NexusBank</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: 'DM Sans', system-ui, sans-serif;
        background: #080c14; color: #e8edf8;
    }
    .err-wrap { text-align: center; padding: 40px 24px; max-width: 520px; }
    .err-code { font-size: 7rem; font-weight: 900; line-height: 1; opacity: 0.25; }
    .err-title { font-size: 1.5rem; font-weight: 700; margin-top: 16px; }
    .err-msg { color: #8896b3; margin-top: 10px; line-height: 1.7; font-size: 0.9rem; }
    .err-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 28px;
               padding: 10px 22px; background: #3d6fd4; color: #fff; text-decoration: none;
               border-radius: 8px; font-size: 0.9rem; font-weight: 500; transition: opacity 0.2s; }
    .err-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
<div class="err-wrap">
  <div class="err-code">404</div>
  <h1 class="err-title">Page Not Found</h1>
  <p class="err-msg">The page you are looking for does not exist or has been moved. Please verify the URL or navigate back to your dashboard.</p>
  <a th:href="@{/dashboard}" class="err-btn">
    <i class="bi bi-house"></i> Return to Dashboard
  </a>
</div>
</body>
</html>
